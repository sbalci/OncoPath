url: https://www.serdarbalci.com/OncoPath/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem

home:
  title: "OncoPath • Specialized Oncological and Pathological Research Tools"
  description: >
    OncoPath is a specialized jamovi module for oncological and pathological
    research. It provides comprehensive patient follow-up visualization tools
    including swimmer plots, waterfall plots, IHC heterogeneity analysis, and
    diagnostic test meta-analysis.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
      - text: "Getting Started"
      - text: "Swimmer Plot Guide"
        href: articles/swimmerplot-unified-comprehensive.html
      - text: "Waterfall Plot Guide"
        href: articles/06-function-waterfall.html
      - text: "---"
      - text: "Advanced Topics"
      - text: "Diagnostic Meta-Analysis"
        href: articles/diagnosticmeta-comprehensive.html
      - text: "Clinical Heatmap"
        href: articles/clinicalheatmap_comprehensive.html
      - text: "---"
      - text: "Legacy Documentation"
      - text: "Waterfall Legacy"
        href: articles/09-waterfall-legacy.html
    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/sbalci/OncoPath
      aria-label: View source on GitHub

reference:
# NOTE: this index previously listed 26 topics that do not exist in OncoPath -
# the IHC helpers (calculateHScore, getIHCTheme, validateIHCData, ...) live in
# the main ClinicoPath module (R/ihc_utilities.R), and calculate_sensitivity and
# friends exist in neither. It also carried three starts_with() selectors that
# matched no file (the topic is null_coalescing.Rd, with an underscore, not
# "null-coalescing"). pkgdown aborts the whole build on the first such entry.
# Topics marked \keyword{internal} (pipe, null_coalescing, .escapeVariableNames,
# recist_context, recist_engine, recist_select_target_lesions) are excluded by
# pkgdown automatically and must NOT be listed here.
  - title: "Main Analysis Functions"
    desc: "Core functions for oncological and pathological research"
    contents:
    - swimmerplot
    - swimmerplotClass
    - waterfall
    - waterfallClass
    - diagnosticmeta
    - diagnosticmetaClass
    - ihcheterogeneity

  - title: "Diagnostic Test Functions"
    desc: "Functions for diagnostic test accuracy analysis"
    contents:
    - bootstrapIDI

  - title: "Utility Functions"
    desc: "Helper functions for data processing"
    contents:
    - raw_to_prob

  - title: "Datasets"
    desc: "Bundled example datasets"
    contents:
    - diagnostic_studies
    - histopathology
    - swimmerplot_sample
    - waterfall_percentage_basic
    - waterfall_raw_longitudinal

  - title: "Package Information"
    desc: "Package startup and information"
    contents:
    - clinicopath_startup_message

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: "Developed by [Serdar Balci](https://www.serdarbalci.com/)"
    built_with: "Built with [pkgdown](https://pkgdown.r-lib.org/) and [Bootstrap 5](https://getbootstrap.com/)"

authors:
  Serdar Balci:
    href: https://www.serdarbalci.com/
