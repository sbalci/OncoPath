---
title: OncoPath Functions for Clinicopathological Research
name: OncoPath
version: 1.0.51
jms: '1.0'
authors:
  - Serdar Balci
maintainer: Serdar Balci <serdarbalci@serdarbalci.com>
date: '2026-08-12'
type: R
description: >-
  OncoPath Functions for Clinicopathological Research. Specialized oncology and
  pathology visualization tools from ClinicoPath jamovi module. OncoPath helps
  researchers create comprehensive patient follow-up plots including waterfall
  plots for treatment response analysis and swimmer plots for patient timeline
  visualization. For comments, suggestions, feature requests or reporting bugs,
  please open an issue at
  <https://github.com/sbalci/ClinicoPathJamoviModule/issues/>.
analyses:
  - title: 'Treatment Response: Patient-Level Burden'
    name: waterfall
    ns: OncoPath
    menuGroup: OncoPath
    menuTitle: 'Treatment Response: Patient-Level Burden'
    menuSubgroup: Patient Follow-Up Plots
    description: >
      Use this when you have one tumour burden number per patient: either a
      percent change from baseline you have already calculated (one row per
      patient), or a single measurement recorded at each visit (one row per
      patient per visit). It draws waterfall and spider plots, assigns each
      patient a best response from their largest shrinkage from baseline, and
      reports ORR and DCR with exact binomial confidence intervals, group
      comparison, time to response and duration of response. When a time
      variable is supplied, progression is measured against the patient's
      smallest recorded burden (nadir), not against baseline. Categories are
      named CR, PR, SD and PD and the thresholds are adapted from RECIST v1.1,
      but this is NOT a RECIST v1.1 implementation: because it never sees
      individual lesions it cannot sum target lesions, detect a new lesion, or
      judge non-target progression, and it cannot apply the 4-week confirmation
      rule itself (you may supply your own confirmation column). If your data
      list each lesion separately, use the lesion-level RECIST v1.1 analysis. It
      will be available in upcoming releases.
    ribbon: analyses
    menuSubtitle: One burden value per patient or visit
    category: analyses
  - title: Swimmer Plot
    name: swimmerplot
    ns: OncoPath
    ribbon: analyses
    menuGroup: OncoPath
    menuSubgroup: Patient Follow-Up Plots
    menuTitle: Swimmer Plot
    description: >
      Creates comprehensive swimmer plots using the ggswim package to visualize
      patient timelines,  clinical events, milestones, and treatment responses.
      Features enhanced data validation  and complete ggswim integration for
      professional clinical visualization.
    category: analyses
  - title: IHC Heterogeneity Analysis
    name: ihcheterogeneity
    ns: OncoPath
    category: analyses
    menuGroup: OncoPath
    menuSubgroup: IHC Analysis
    menuTitle: IHC Heterogeneity Analysis
  - title: Diagnostic Test Meta-Analysis for Pathology
    name: diagnosticmeta
    ns: OncoPath
    category: analyses
    menuGroup: OncoPath
    menuTitle: Diagnostic Test Meta-Analysis for Pathology
    description: >
      Comprehensive meta-analysis of diagnostic test accuracy studies designed
      for

      pathology research. Performs bivariate random-effects modeling,
      proportional-hazards SROC analysis,

      meta-regression, and publication bias assessment for AI algorithm
      validation

      and biomarker diagnostic accuracy synthesis.
    menuSubgroup: IHC Analysis
datasets:
