  <!-- Oncological Reference Baseline -->
  <path d="M 6 38 L 68 38" stroke="#3e6da9" stroke-width="1.5" stroke-dasharray="1, 3" fill="none"/>
  
  <!-- DNA Double Helix Structure (left: cancer genetics/pathology) -->
  <!-- Strand 1 (Gold/Amber) -->
  <path d="M 10 32 C 14 32, 17 22, 21 16 C 25 10, 28 10, 32 16 C 36 22, 39 32, 43 32" 
        fill="none" stroke="#e6ac40" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Strand 2 (Blue) -->
  <path d="M 10 16 C 14 16, 17 26, 21 32 C 25 38, 28 38, 32 32 C 36 26, 39 16, 43 16" 
        fill="none" stroke="#6b9de8" stroke-width="2.2" stroke-linecap="round"/>
        
  <!-- Base-pair rungs connecting strands -->
  <line x1="16" y1="21" x2="16" y2="27" stroke="#3e6da9" stroke-width="1.6"/>
  <line x1="26" y1="12" x2="26" y2="36" stroke="#9f9f9f" stroke-width="1.6"/>
  <line x1="37" y1="21" x2="37" y2="27" stroke="#3e6da9" stroke-width="1.6"/>
  
  <!-- Oncology Outcomes / Tumor Waterfall Bars (right: staging & response) -->
  <rect x="47" y="14" width="5" height="24" fill="#6b9de8" stroke="#3e6da9" stroke-width="1.5" rx="0.5"/>
  <rect x="54" y="21" width="5" height="17" fill="#ffffff" stroke="#e6ac40" stroke-width="1.5" rx="0.5"/>
  <rect x="61" y="27" width="5" height="11" fill="#e6ac40" stroke="#e6ac40" stroke-width="1.5" rx="0.5"/>
  
  <!-- Target / Biomarker Nodes -->
  <circle cx="21" cy="24" r="2.8" fill="#ffffff" stroke="#3e6da9" stroke-width="1.8"/>
  <circle cx="32" cy="24" r="2.8" fill="#ffffff" stroke="#3e6da9" stroke-width="1.8"/>
</svg>
