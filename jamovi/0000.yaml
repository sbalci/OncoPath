      - Oncology
      - Pathology
      - Follow-up
  - name: Waterfall and Spider Plot
    path: waterfall_raw_longitudinal.omv
    description: Example longitudinal analysis for Waterfall and Spider Plot.
    tags:
      - Waterfall Plot
      - Spider Plot
      - Oncology
      - Pathology
      - Follow-up
  - name: Diagnostic Test Meta-Analysis
    path: diagnosticmeta_test_categorical.omv
    description: >-
      Example analysis for Diagnostic Test Meta-Analysis: 20 studies with an
      imaging-modality covariate, enough for heterogeneity and meta-regression.
    tags:
      - Diagnostic Test Meta-Analysis
      - Meta-Analysis
      - Oncology
      - Pathology
  - name: IHC Heterogeneity
    path: ihcheterogeneity_test.omv
    description: >-
      Example analysis for IHC Heterogeneity: 50 cases with a whole-section
      reference, four biopsies and a spatial compartment.
    tags:
      - IHC Heterogeneity
      - Immunohistochemistry
      - Oncology
      - Pathology
usesNative: true
